<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Hoy — SEKaform</title>
  <link rel="stylesheet" href="styles.css">
  <script id="skfSidebarPre">
    if (localStorage.getItem('skf_sidebar_collapsed') === 'true' ||
        (localStorage.getItem('skf_sidebar_collapsed') === null && window.matchMedia('(max-width:860px)').matches)) {
      document.documentElement.classList.add('sb-collapsed');
    }
  </script>
  <style>
    .wrapper { max-width: 720px; margin: 0 auto; padding: 36px 16px 40px; }
    .saludo { margin-bottom: 18px; }
    .saludo .fecha { color: var(--mut); font-size: .84rem; font-weight: 700; }
    .saludo h1 { font-size: 1.7rem; font-weight: 900; letter-spacing: -.8px; line-height: 1.15; margin-top: 2px; }

    /* Anillo de cumplimiento: el estado de la empresa de un vistazo */
    .anillo { display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: center; padding: 16px 18px;
      border-radius: 20px; background: var(--card); border: 1px solid var(--bor); text-decoration: none; color: inherit; margin-bottom: 14px; }
    .anillo:active { transform: scale(.99); }
    .anillo svg { width: 104px; height: 104px; display: block; }
    .anillo .an-n { font-size: 1.7rem; font-weight: 900; fill: var(--txt); }
    .anillo .an-de { font-size: .62rem; font-weight: 700; fill: var(--mut); }
    .an-t { font-size: 1.02rem; font-weight: 800; line-height: 1.3; }
    .an-s { color: var(--mut); font-size: .82rem; margin-top: 4px; line-height: 1.4; }
    .an-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .an-chip { font-size: .72rem; font-weight: 800; border-radius: 999px; padding: 3px 9px; background: var(--bor); }
    .an-chip.warn { background: rgba(245,158,11,.16); color: var(--warn); }
    .an-chip.ok { background: var(--ok-dim); color: var(--ok); }
    .an-ver { color: var(--pri-txt); font-weight: 800; font-size: .84rem; margin-top: 8px; display: inline-block; }

    /* Tu siguiente paso */
    .next-step { display: grid; grid-template-columns: 50px 1fr auto; gap: 14px; align-items: center;
      background: linear-gradient(145deg, #3b82f6, #1d4ed8); color: #fff; border-radius: 20px; padding: 16px 18px; margin: 0 0 14px;
      text-decoration: none; box-shadow: 0 14px 30px -14px rgba(37,99,235,.85); }
    .next-step:active { transform: scale(.99); }
    .next-step.ok { background: linear-gradient(145deg, #2dd4bf, #0f9d84); color: #04211b; box-shadow: 0 14px 30px -14px rgba(26,188,156,.7); }
    .next-step.warn { background: linear-gradient(145deg, #d97706, #b45309); box-shadow: 0 14px 30px -14px rgba(180,83,9,.7); }
    .next-step .ns-ico { width: 50px; height: 50px; border-radius: 15px; background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center; font-size: 1.55rem; }
    .next-step .ns-kick { font-size: .66rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; opacity: .85; }
    .next-step .ns-t { font-size: 1.08rem; font-weight: 800; line-height: 1.25; margin-top: 2px; }
    .next-step .ns-s { font-size: .82rem; opacity: .92; margin-top: 3px; line-height: 1.4; }
    .next-step .ns-arr { font-size: 1.5rem; font-weight: 700; }

    .bloque-h { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 2px 10px; }
    .bloque-h h2 { font-size: 1.05rem; font-weight: 800; }
    .bloque-h a { color: var(--pri-txt); font-weight: 700; font-size: .86rem; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }

    .ag-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; min-height: 66px; padding: 10px 12px; margin-bottom: 8px;
      border-radius: 16px; background: var(--card); border: 1px solid var(--bor); color: var(--txt); text-decoration: none; }
    .ag-item:active { transform: scale(.985); }
    .ag-item.vencido { border-left: 4px solid var(--err); }
    .ag-item.hoy { border-left: 4px solid var(--pri); }
    .ag-ico { width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; background: rgba(110,168,254,.12); }
    .ag-t { font-weight: 800; font-size: .95rem; line-height: 1.25; }
    .ag-d { font-size: .78rem; color: var(--mut); margin-top: 2px; line-height: 1.35; display: block; }
    .ag-cuando { font-size: .72rem; font-weight: 800; white-space: nowrap; padding: 5px 9px; border-radius: 999px; background: var(--bor); }
    .ag-item.vencido .ag-cuando { background: rgba(248,113,113,.16); color: var(--err-txt); }
    .ag-item.hoy .ag-cuando { background: rgba(110,168,254,.18); color: var(--pri-txt); }
    .hoy-vacio { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 16px; background: var(--card); border: 1px dashed var(--bor); color: var(--mut); font-size: .88rem; line-height: 1.45; }
    .hoy-vacio b { color: var(--txt); display: block; }
    .hoy-vacio a { color: var(--pri-txt); font-weight: 700; text-decoration: none; }

    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { display: block; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--bor); text-decoration: none; color: inherit; min-height: 96px; }
    .tile:active { transform: scale(.985); }
    .tile .tn { font-size: 1.9rem; font-weight: 900; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .tile .tl { color: var(--mut); font-size: .8rem; font-weight: 700; line-height: 1.3; }
    .tile.alerta .tn { color: var(--err-txt); }
    .tile.bien .tn { color: var(--ok); }

    .demo-link { display: block; width: 100%; margin: 22px 0 0; min-height: 48px; padding: 11px 14px; background: none; border: 1px dashed var(--bor);
      border-radius: 14px; color: var(--mut); font-size: .84rem; font-family: inherit; cursor: pointer; text-align: center; line-height: 1.4; }
    .esqueleto { height: 66px; border-radius: 16px; background: linear-gradient(90deg, var(--card), var(--card2), var(--card)); background-size: 200% 100%; animation: brillo 1.2s infinite linear; margin-bottom: 8px; }
    @keyframes brillo { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    footer { text-align: center; margin-top: 34px; font-size: .74rem; color: var(--mut); }
  </style>
</head>
<body>
  <script src="skf-api.js"></script>
  <script src="form-library.js"></script>
  <script src="agenda.js"></script>
  <script src="sidebar.js"></script>

  <div class="wrapper">
    <div class="saludo">
      <div class="fecha" id="fecha"></div>
      <h1 id="hola">Hola 👋</h1>
    </div>

    <!-- Estado de cumplimiento (9 principios) -->
    <a class="anillo" href="cumplimiento.html" id="anillo" aria-label="Ver el mapa de cumplimiento">
      <svg viewBox="0 0 104 104" role="img" aria-labelledby="anT">
        <circle cx="52" cy="52" r="44" fill="none" stroke="var(--bor)" stroke-width="10"/>
        <circle id="anArco" cx="52" cy="52" r="44" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="0 276.5" transform="rotate(-90 52 52)" style="transition: stroke-dasharray .6s ease"/>
        <text x="52" y="55" text-anchor="middle" class="an-n" id="anN">–</text>
        <text x="52" y="71" text-anchor="middle" class="an-de">de 9</text>
      </svg>
      <div>
        <div class="an-t" id="anT">Principios de SST con evidencia al día</div>
        <div class="an-s" id="anS">Lo que un inspector del trabajo viene a verificar.</div>
        <div class="an-chips" id="anChips"></div>
        <span class="an-ver">Ver el mapa ›</span>
      </div>
    </a>

    <!-- Tu siguiente paso: una sola cosa por hacer, según tu estado real -->
    <a class="next-step" id="nextStep" href="plantillas.html?v=sst" hidden>
      <span class="ns-ico" id="nsIco">➜</span>
      <div class="ns-body">
        <div class="ns-kick">Tu siguiente paso</div>
        <div class="ns-t" id="nsT"></div>
        <div class="ns-s" id="nsS"></div>
      </div>
      <span class="ns-arr">→</span>
    </a>

    <!-- Lo que toca hoy (rutinas, encargos y turnos) -->
    <div class="bloque-h"><h2>Para hoy</h2><a href="plan.html">Ver el plan ›</a></div>
    <div id="hoyLista"><div class="esqueleto"></div><div class="esqueleto"></div></div>

    <div class="bloque-h"><h2>Seguimiento</h2></div>
    <div class="tiles">
      <a class="tile" href="hallazgos.html" id="tHz"><div class="tn" id="tHzN">–</div><div class="tl" id="tHzL">hallazgos abiertos</div></a>
      <a class="tile" href="dashboard.html" id="tReg"><div class="tn" id="tRegN">–</div><div class="tl">registros en los últimos 7 días</div></a>
    </div>

    <button type="button" class="demo-link" id="demoBtn" hidden>🧪 Probar con datos de ejemplo — ver la app llena antes de capturar los tuyos</button>

    <footer>SEKaform · Kanan Sentinel</footer>
  </div>

  <script>
    // «Hoy»: el estado de la empresa y lo que toca, con datos reales. Sin sesión o sin conexión
    // se queda con lo que haya en el dispositivo — nunca adivina.
    (function saludo() {
      const ahora = new Date(), h = ahora.getHours();
      const f = ahora.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('fecha').textContent = f.charAt(0).toUpperCase() + f.slice(1);
      document.getElementById('hola').textContent = (h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches') + ' 👋';
    })();
    const _esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

    (async function hoy() {
      let hz = null, env = null, acc = null, plt = null, ag = null;
      try {
        [hz, env, acc, plt, ag] = await Promise.all([
          (typeof sbLoadHallazgos === 'function' ? sbLoadHallazgos() : Promise.resolve(null)).catch(() => null),
          (typeof sbLoadEnvios === 'function' ? sbLoadEnvios() : Promise.resolve(null)).catch(() => null),
          (typeof sbLoadAccionesCorrectivas === 'function' ? sbLoadAccionesCorrectivas() : Promise.resolve(null)).catch(() => null),
          (typeof sbLoadPlantillas === 'function' ? sbLoadPlantillas() : Promise.resolve(null)).catch(() => null),
          skfAgendaDatos().catch(() => null),
        ]);
      } catch (e) {}
      const lee = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } };
      const envios = Array.isArray(env) ? env : lee('skf_envios');
      const hallaz = Array.isArray(hz) ? hz : lee('skf_hallazgos');
      let email = ''; try { const u = await sbGetUser(); email = (u && u.email) || ''; } catch (e) {}
      let org = (ag && ag.org) || null; if (!org) { try { org = await sbLoadOrg(); } catch (e) {} }
      const pc = ({ co:'co', pa:'pa', cr:'cr', sv:'sv', colombia:'co', 'panamá':'pa', panama:'pa', 'costa rica':'cr', 'el salvador':'sv' })[String((org && org.pais) || '').trim().toLowerCase()] || 'co';

      // ── Anillo: principios con evidencia al día ──────────────────────────
      const ev = skfEvidenciaPrincipios(envios, pc);
      const estados = SST_PRINCIPIOS.map(p => ({ p, st: skfEstadoPrincipio(ev[p.id]), ev: ev[p.id] }));
      const nOk = estados.filter(x => x.st === 'ok').length, atras = estados.filter(x => x.st === 'warn'), pend = estados.filter(x => x.st === 'pend');
      document.getElementById('anN').textContent = nOk;
      document.getElementById('anArco').setAttribute('stroke-dasharray', (276.5 * nOk / 9).toFixed(1) + ' 276.5');
      document.getElementById('anArco').setAttribute('stroke', nOk === 9 ? 'var(--ok)' : nOk >= 5 ? 'var(--pri-txt)' : 'var(--warn)');
      document.getElementById('anT').textContent = nOk === 9 ? '¡Los 9 principios al día!' : nOk + ' de 9 principios de SST con evidencia al día';
      document.getElementById('anChips').innerHTML =
        (atras.length ? `<span class="an-chip warn">${atras.length} atrasado${atras.length !== 1 ? 's' : ''}</span>` : '') +
        (pend.length ? `<span class="an-chip">${pend.length} sin evidencia</span>` : '') +
        (nOk === 9 ? '<span class="an-chip ok">Listo para una inspección</span>' : '');

      // ── Para hoy ─────────────────────────────────────────────────────────
      const hoyItems = ag ? skfAgendaHoy(skfAgenda(ag, new Date())) : [];
      const lista = document.getElementById('hoyLista');
      if (hoyItems.length) {
        lista.innerHTML = hoyItems.slice(0, 5).map(i => `<a class="ag-item ${i.estado}" href="${i.href}">
          <span class="ag-ico" aria-hidden="true">${SKF_AGENDA_TIPOS[i.tipo].ico}</span>
          <span><span class="ag-t">${_esc(i.titulo)}</span><span class="ag-d">${_esc(i.detalle)}</span></span>
          <span class="ag-cuando">${_esc(skfAgendaCuando(i))}</span></a>`).join('') +
          (hoyItems.length > 5 ? `<a class="skf-sheet-mas" href="plan.html">Y ${hoyItems.length - 5} más en el plan ›</a>` : '');
      } else {
        const hayPlan = ag && ((ag.inspecciones || []).length || (ag.asignaciones || []).length || ((ag.turnosConfig || {}).turnos || []).length);
        lista.innerHTML = `<div class="hoy-vacio"><span style="font-size:1.6rem">${hayPlan ? '✨' : '🗓️'}</span><span>${hayPlan
          ? '<b>Nada vence hoy</b>Lo próximo está en tu plan.'
          : '<b>Aún no tienes un plan</b>Define qué se revisa con regularidad y aquí verás lo que toca cada día. <a href="plan.html">Planear ›</a>'}</span></div>`;
      }

      // ── Seguimiento ──────────────────────────────────────────────────────
      const abiertos = hallaz.filter(h => (h.estado || 'abierto') !== 'cerrado');
      const criticos = abiertos.filter(h => h.severidad === 'critico').length;
      document.getElementById('tHzN').textContent = abiertos.length;
      document.getElementById('tHzL').textContent = abiertos.length ? 'hallazgo' + (abiertos.length !== 1 ? 's' : '') + ' abierto' + (abiertos.length !== 1 ? 's' : '') + (criticos ? ' · ' + criticos + ' crítico' + (criticos !== 1 ? 's' : '') : '') : 'hallazgos abiertos — al día';
      document.getElementById('tHz').classList.add(abiertos.length ? 'alerta' : 'bien');
      const semana = Date.now() - 7 * 864e5;
      document.getElementById('tRegN').textContent = envios.filter(e => new Date(e.enviado_en || e.enviadoEn || e.creado_en || e.creadoEn).getTime() >= semana).length;

      // ── Tu siguiente paso ───────────────────────────────────────────────
      // Solo con datos cargados de verdad (null = sin conexión: no se adivina).
      if (!Array.isArray(env) || !Array.isArray(plt) || !Array.isArray(hz)) return;
      const perfil = skfPerfilGet(email) || {};
      const sinDatos = plt.length === 0 && env.length === 0;

      // Cuenta nueva: se lleva al asistente (una sola vez por sesión, y se puede saltar).
      if (!perfil.completo && !perfil.omitido && sinDatos && !sessionStorage.getItem('skf_bv')) {
        sessionStorage.setItem('skf_bv', '1');
        location.href = 'bienvenida.html';
        return;
      }

      const kitDe = id => AREA_KITS.find(k => k.id === id);
      const kitPendiente = (perfil.areas || []).map(kitDe).filter(Boolean).find(k => skfKitFaltantes(k, pc).length > 0);
      const hoy0 = new Date(); hoy0.setHours(0, 0, 0, 0);
      const ids = new Set(abiertos.map(h => h.id));
      const venc = Array.isArray(acc) ? acc.filter(a => {
        const fl = a.fecha_limite || a.fechaLimite;
        return (a.estado || '') !== 'completada' && ids.has(a.hallazgo_id || a.hallazgoId) && fl && new Date(fl) < hoy0;
      }).length : 0;

      let paso;
      if (sinDatos && !perfil.completo) paso = { ico:'🏢', t:'Cuéntanos de tu empresa', s:'1 minuto: te dejamos listo lo que la ley exige a una empresa como la tuya.', href:'bienvenida.html' };
      else if (env.length === 0) paso = { ico:'🔎', t:'Haz tu primera inspección', s:'Toma 2 minutos y ya tendrás evidencia de que cumples.', href: plt.length ? 'llenar.html?tmpl=' + encodeURIComponent(plt[0].id) : 'digitalizador.html?preset=inspeccion_sst' };
      else if (venc > 0) paso = { ico:'⏰', t: venc + ' acción' + (venc !== 1 ? 'es' : '') + ' correctiva' + (venc !== 1 ? 's' : '') + ' vencida' + (venc !== 1 ? 's' : ''), s:'Ciérralas antes de que lo vea el inspector del trabajo.', href:'hallazgos.html', cls:'warn' };
      else if (abiertos.length > 0) paso = { ico:'⚠️', t:'Cierra ' + abiertos.length + ' hallazgo' + (abiertos.length !== 1 ? 's' : '') + ' abierto' + (abiertos.length !== 1 ? 's' : ''), s:'Asigna un responsable y una fecha a cada uno.', href:'hallazgos.html' };
      else if (!perfil.completo && !perfil.omitido) paso = { ico:'🧭', t:'Revisa los datos de tu empresa', s:'1 minuto: te dejamos listo lo que la ley exige a tu empresa y tus formularios por actividad.', href:'bienvenida.html' };
      else if (kitPendiente) paso = { ico: kitPendiente.ico, t:'Agrega tu kit de «' + kitPendiente.nombre + '»', s: skfKitFaltantes(kitPendiente, pc).length + ' formularios para empezar, en un toque.', href:'empresa.html#areas' };
      else if (atras.length > 0 || pend.length > 0) {
        // Directo al formulario que cubre el principio (uno que ya tenga, si lo hay), no al Mapa.
        const mias = plt.map(p => ({ id: p.id, nombre: p.nombre }));
        lee('skf_plantillas').forEach(p => mias.push({ id: p.id, nombre: p.nombre }));
        if (atras.length > 0) {
          const x = atras[0], d = skfFormularioParaPrincipio(x.p.id, pc, mias);
          paso = { ico:'🔄', t:'Renueva la evidencia de «' + x.p.nombre + '»',
            s:'La última tiene ' + x.ev.dias + ' días. ' + (d ? 'Renuévala con «' + d.nombre + '».' : 'Ábrelo en tu mapa de cumplimiento.'),
            href: d ? d.href : 'cumplimiento.html', cls:'warn' };
        } else {
          const x = pend[0], d = skfFormularioParaPrincipio(x.p.id, pc, mias);
          paso = { ico:'🎯', t:'Te falta evidencia de «' + x.p.nombre + '»',
            s:(d ? 'Empieza con «' + d.nombre + '».' : 'Mira qué formulario lo cubre.'),
            href: d ? d.href : 'cumplimiento.html' };
        }
      }
      else paso = { ico:'✅', t:'Todo al día', s:'Tienes evidencia reciente de los 9 principios.', href:'cumplimiento.html', cls:'ok' };

      const card = document.getElementById('nextStep');
      card.href = paso.href;
      card.className = 'next-step' + (paso.cls ? ' ' + paso.cls : '');
      document.getElementById('nsIco').textContent = paso.ico;
      document.getElementById('nsT').textContent = paso.t;
      document.getElementById('nsS').textContent = paso.s;
      card.hidden = false;
      // Ofrecer el ejemplo mientras la cuenta tenga poco que mostrar (nunca dentro del propio ejemplo).
      if (!skfDemoActivo() && env.length < 3) {
        const db = document.getElementById('demoBtn');
        db.hidden = false;
        db.onclick = () => { if (skfDemoEntrar()) location.reload(); else alert('No se pudo preparar el ejemplo en este dispositivo.'); };
      }
      if (typeof skfGlosar === 'function') skfGlosar(document.querySelector('.wrapper'));
    })();
  </script>
</body>
</html>
