<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Hallazgos — SEKaform</title>
  <link rel="stylesheet" href="styles.css">
  <script src="skf-api.js"></script>
  <script id="skfSidebarPre">
    if (localStorage.getItem('skf_sidebar_collapsed') === 'true' ||
        (localStorage.getItem('skf_sidebar_collapsed') === null && window.matchMedia('(max-width:860px)').matches)) {
      document.documentElement.classList.add('sb-collapsed');
    }
  </script>
  <style>
    .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 80px; }
    .pg-h { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
    .pg-sub { color: var(--mut); font-size: .88rem; margin-bottom: 24px; line-height: 1.6; max-width: 640px; }

    .filters { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
    .filt-btn {
      background: var(--card); border: 1px solid var(--bor); color: var(--mut);
      padding: 7px 14px; border-radius: 20px; font-size: .8rem; font-weight: 700;
      cursor: pointer; transition: all .15s; font-family: inherit;
    }
    .filt-btn:hover { border-color: var(--pri); color: var(--txt); }
    .filt-btn.active { background: var(--pri); border-color: var(--pri); color: #fff; }

    .hz-card { background: var(--card); border: 1px solid var(--bor); border-left: 3px solid var(--bor); border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; }
    .hz-card.sev-critico { border-left-color: var(--err); }
    .hz-card.sev-mayor { border-left-color: var(--warn); }
    .hz-card.sev-menor { border-left-color: #eab308; }
    .hz-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .hz-badge { font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; padding: 3px 9px; border-radius: 20px; }
    .hz-badge.sev-critico { background: rgba(239,68,68,.15); color: var(--err-txt); }
    .hz-badge.sev-mayor { background: rgba(245,158,11,.15); color: var(--warn); }
    .hz-badge.sev-menor { background: rgba(234,179,8,.15); color: #eab308; }
    .hz-plantilla { font-weight: 800; font-size: .95rem; margin-top: 8px; }
    .hz-campo { font-size: .78rem; color: var(--mut); margin-top: 2px; }
    .hz-desc { font-size: .87rem; margin-top: 8px; line-height: 1.5; }
    .hz-meta { font-size: .74rem; color: var(--mut); margin-top: 8px; }

    .hz-fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .hz-foto { position: relative; display: block; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; border: 1px solid var(--bor); background: var(--inp); padding: 0; cursor: pointer; font: inherit; color: var(--mut); }
    .hz-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hz-foto b { position: absolute; left: 6px; top: 6px; padding: 2px 8px; border-radius: 99px; font-size: .7rem; background: rgba(0,0,0,.65); color: #fff; }
    .hz-foto.vacia { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: .8rem; border-style: dashed; }
    .hz-foto.vacia b { position: static; background: transparent; color: var(--mut); padding: 0; }
    .hz-portal { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; font-size: .84rem; cursor: pointer; min-height: 44px; }
    .hz-portal input { width: 22px; height: 22px; flex: none; margin-top: 1px; }
    .hz-portal small { display: block; color: var(--mut); font-size: .76rem; margin-top: 2px; }
    .hz-estado { font-size: .74rem; font-weight: 800; border-radius: 999px; padding: 4px 10px; background: var(--bor); color: var(--txt); }
    .hz-estado.en_proceso { background: rgba(110,168,254,.16); color: var(--pri-txt); }
    .hz-estado.vencido { background: rgba(248,113,113,.16); color: #fca5a5; }
    .hz-estado.cerrado { background: var(--ok-dim); color: var(--ok); }
    .hz-resp { margin-top: 10px; font-size: .86rem; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .hz-link { background: none; border: 0; color: var(--pri-txt); font: inherit; font-weight: 700; cursor: pointer; padding: 6px 4px; min-height: 36px; }
    .hz-asignar { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 46px; margin-top: 10px; border: 1px dashed var(--bor);
      border-radius: 12px; background: transparent; color: var(--txt); font: inherit; font-weight: 700; cursor: pointer; }
    .hz-cerrar-btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px; background: var(--ok); color: #04241d; font: inherit; font-weight: 800; cursor: pointer; }
    .cz-fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .cz-tomar { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border: 1px solid var(--pri); border-radius: 12px; background: var(--pri-dim); color: var(--txt); font-weight: 800; cursor: pointer; }
    .cz-acc { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .cz-acc button { min-height: 48px; border-radius: 12px; font: inherit; font-weight: 800; cursor: pointer; }
    .cz-ok { border: 0; background: var(--ok); color: #04241d; }
    .cz-sin { border: 1px solid var(--bor); background: transparent; color: var(--mut); }
    .cz-nota { font-size: .8rem; color: var(--mut); margin: 0 0 12px; line-height: 1.45; }

    .btn-sm { padding: 7px 13px; font-size: .8rem; border-radius: 7px; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--mut); }
    .es-ico { font-size: 3.5rem; display: block; margin-bottom: 14px; }
    .empty-state h2 { font-size: 1.05rem; margin-bottom: 8px; color: var(--txt); }
    .empty-state p { font-size: .85rem; line-height: 1.55; max-width: 360px; margin: 0 auto; }

    .toast {
      position: fixed; bottom: 24px; right: 16px; background: var(--card);
      border: 1px solid var(--bor); border-radius: 10px; padding: 12px 16px;
      display: flex; align-items: center; gap: 9px; font-size: 0.85rem; font-weight: 600;
      z-index: 2000; animation: toastIn .2s ease; box-shadow: 0 8px 28px rgba(0,0,0,.5); max-width: 280px;
    }
    .toast.ok { border-color: var(--ok); }
    .toast.er { border-color: var(--err); }
    @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

<script src="sidebar.js"></script>

<div class="wrap">
  <div class="pg-eyebrow">⛑️ Salud Ocupacional</div>
  <h1 class="pg-h">Hallazgos<button class="skf-help" data-help-t="¿Qué es un hallazgo?" data-help="Es algo que no cumple: se registra solo cuando una respuesta de formulario indica un problema (por ejemplo un «No» en una inspección), o se reporta a mano con foto desde el formulario.

Estados:
• Abierto: nadie lo está atendiendo todavía.
• En atención: alguien ya trabaja en corregirlo.
• Cerrado: quedó resuelto.

Severidades: 🔴 Crítico (actuar ya) · 🟠 Mayor · 🟡 Menor.
Toca un hallazgo para asignar responsable y fecha límite.">?</button></h1>
  <p class="pg-sub">Lo que el equipo de campo encontró que no cumple — detectado automáticamente al llenar un formulario o reportado a mano. Asigna un responsable y fecha límite para cerrarlo.</p>

  <div class="filters" id="filtEstado"></div>
  <div class="filters" id="filtSev"></div>

  <div id="hzList"></div>
</div>

<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function getHallazgos() { return JSON.parse(localStorage.getItem('skf_hallazgos')||'[]'); }
function setHallazgos(list) { localStorage.setItem('skf_hallazgos', JSON.stringify(list)); }
function getAcciones() { return JSON.parse(localStorage.getItem('skf_acciones_correctivas')||'[]'); }
function setAcciones(list) { localStorage.setItem('skf_acciones_correctivas', JSON.stringify(list)); }

function normalizeHallazgoFromCloud(h) {
  return {
    id: h.id, envioId: h.envio_id||h.envioId, plantillaId: h.plantilla_id||h.plantillaId,
    plantillaNombre: h.plantilla_nombre||h.plantillaNombre, campoId: h.campo_id||h.campoId,
    campoEtiqueta: h.campo_etiqueta||h.campoEtiqueta, origen: h.origen, severidad: h.severidad,
    descripcion: h.descripcion, foto: h.foto, estado: h.estado||'abierto',
    unidadId: h.unidad_id||h.unidadId||null, fotoOcultaPortal: !!(h.foto_oculta_portal||h.fotoOcultaPortal),
    cerradoEn: h.cerrado_en||h.cerradoEn||null, cerradoPor: h.cerrado_por||h.cerradoPor||null,
    reportadoPor: h.reportado_por||h.reportadoPor, creadoEn: h.creado_en||h.creadoEn
  };
}
function normalizeAccionFromCloud(a) {
  return {
    id: a.id, hallazgoId: a.hallazgo_id||a.hallazgoId, responsable: a.responsable,
    correo: a.correo, fechaLimite: a.fecha_limite||a.fechaLimite, estado: a.estado||'pendiente',
    evidenciaCierre: a.evidencia_cierre||a.evidenciaCierre, cerradoEn: a.cerrado_en||a.cerradoEn,
    creadoEn: a.creado_en||a.creadoEn
  };
}

async function syncFromCloud() {
  let fromCloud = false;
  if (!navigator.onLine) return fromCloud;
  try {
    await skfProcessQueue();   // empuja lo pendiente antes de leer: la nube queda al día
    const [cloudH, cloudA] = await Promise.all([sbLoadHallazgos(), sbLoadAccionesCorrectivas()]);
    if (cloudH !== null) fromCloud = true;
    skfReconcile('skf_hallazgos', cloudH, normalizeHallazgoFromCloud);
    skfReconcile('skf_acciones_correctivas', cloudA, normalizeAccionFromCloud);
    await rescatarAcciones(cloudA);
  } catch (e) { /* offline-first: keep local data as-is */ }
  return fromCloud;
}

// Hasta oct-2026 la app enviaba las acciones correctivas con un nombre que el servidor no
// reconocía: quedaban solo en este teléfono (y en «rechazados»). Se reenvían las que sigan
// sin subir — solo las de hallazgos de esta empresa, que son los que hay en el teléfono.
async function rescatarAcciones(cloudA) {
  if (!Array.isArray(cloudA)) return;
  const enNube = new Set(cloudA.map(a => a.id));
  const hz = new Set(getHallazgos().map(h => h.id));
  const enCola = new Set(skfQueueGet().filter(o => o.tipo === 'accionCorrectiva').map(o => o.datos && o.datos.id));
  const pendientes = getAcciones().filter(a => a && !enNube.has(a.id) && hz.has(a.hallazgoId) && !enCola.has(a.id));
  for (const a of pendientes) { try { await skfSyncOrQueue('accionCorrectiva', a); } catch (e) {} }
  try {
    const r = JSON.parse(localStorage.getItem('skf_rechazados') || '[]');
    const quedan = r.filter(x => !(x.tipo === 'accionCorrectiva' && /Tipo desconocido/.test(x.motivo || '')));
    if (quedan.length !== r.length) { localStorage.setItem('skf_rechazados', JSON.stringify(quedan)); skfUpdateSyncBadge(); }
  } catch (e) {}
}

let filtEstado = 'todos';
let filtSev = 'todas';

function renderFilters() {
  const estados = [['todos','Todos'],['abierto','Abiertos'],['vencido','Vencidos'],['cerrado','Cerrados']];
  document.getElementById('filtEstado').innerHTML = estados.map(([v,l]) =>
    `<button class="filt-btn${filtEstado===v?' active':''}" onclick="setFiltEstado('${v}')">${l}</button>`).join('');

  const sevs = [['todas','Todas las severidades'],['critico','🔴 Crítico'],['mayor','🟠 Mayor'],['menor','🟡 Menor']];
  document.getElementById('filtSev').innerHTML = sevs.map(([v,l]) =>
    `<button class="filt-btn${filtSev===v?' active':''}" onclick="setFiltSev('${v}')">${l}</button>`).join('');
}
function setFiltEstado(v) { filtEstado = v; renderFilters(); render(); }
function setFiltSev(v) { filtSev = v; renderFilters(); render(); }

function render() {
  const el = document.getElementById('hzList');
  const hallazgos = getHallazgos();
  const acciones = getAcciones();

  let list = hallazgos;
  if (filtEstado !== 'todos') list = list.filter(h => {
    const k = estadoHz(h, acciones.find(a => a.hallazgoId === h.id)).k;
    return filtEstado === 'abierto' ? k !== 'cerrado' : k === filtEstado;
  });
  if (filtSev !== 'todas') list = list.filter(h => h.severidad === filtSev);
  list = [...list].sort((a,b) => new Date(b.creadoEn||0) - new Date(a.creadoEn||0));

  if (!hallazgos.length) {
    el.innerHTML = `<div class="empty-state">
      <span class="es-ico">✅</span>
      <h2>Sin hallazgos todavía</h2>
      <p>Aquí aparecen los problemas que el equipo reporta al llenar un formulario. Por ahora todo está en orden. ✓</p>
    </div>`;
    return;
  }
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><p>No hay hallazgos con estos filtros.</p></div>`;
    return;
  }

  const sevLbl = { critico:'🔴 Crítico', mayor:'🟠 Mayor', menor:'🟡 Menor' };

  el.innerHTML = list.map(h => {
    const ac = acciones.find(a => a.hallazgoId === h.id);
    const fecha = h.creadoEn ? new Date(h.creadoEn).toLocaleString('es-CO',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
    const est = estadoHz(h, ac);
    const cerrado = est.k === 'cerrado';
    // Un hallazgo y su acción correctiva son, para quien usa la app, UNA cosa: quién lo
    // corrige, para cuándo, y la prueba de que se corrigió. La «acción» queda por dentro.
    const resp = ac && ac.responsable
      ? `<div class="hz-resp">👤 <b>${esc(ac.responsable)}</b>${ac.fechaLimite ? ` · 📅 antes del ${esc(fechaCorta(ac.fechaLimite))}` : ''}
          ${cerrado ? '' : `<button type="button" class="hz-link" onclick="asignar('${esc(h.id)}', this)">Cambiar</button>`}</div>`
      : (cerrado ? '' : `<button type="button" class="hz-asignar" onclick="asignar('${esc(h.id)}', this)">👤 Asignar responsable y fecha</button>`);
    return `<div class="hz-card sev-${esc(h.severidad)}">
      <div class="hz-top">
        <span class="hz-badge sev-${esc(h.severidad)}">${sevLbl[h.severidad]||h.severidad}</span>
        <span class="hz-estado ${est.k}">${est.t}</span>
      </div>
      <div class="hz-plantilla">${esc(h.plantillaNombre||'Formulario')}</div>
      ${h.descripcion ? `<div class="hz-desc">${esc(h.descripcion)}</div>` : (h.campoEtiqueta ? `<div class="hz-desc">${esc(h.campoEtiqueta)}</div>` : '')}
      <div class="hz-meta">${fecha}${h.reportadoPor ? ' · ' + esc(h.reportadoPor) : ''}</div>
      ${resp}
      ${fotosHtml(h, ac)}
      ${cerrado
        ? `<div class="hz-meta">Cerrado${h.cerradoEn ? ' el ' + esc(fechaCorta(h.cerradoEn)) : ''}${h.cerradoPor ? ' por ' + esc(h.cerradoPor) : ''} · <button type="button" class="hz-link" onclick="reabrir('${esc(h.id)}')">Reabrir</button></div>`
        : `<button type="button" class="hz-cerrar-btn" onclick="abrirCierre('${esc(h.id)}', this)">✓ Cerrar con foto de después</button>`}
    </div>`;
  }).join('');
}

function fechaCorta(f) {
  const d = new Date(String(f).length === 10 ? f + 'T00:00:00' : f);
  return isNaN(d) ? String(f) : d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
}
// Un solo estado, deducido: cerrado · vencido (pasó la fecha) · en atención (tiene responsable) · abierto.
function estadoHz(h, ac) {
  if ((h.estado || 'abierto') === 'cerrado') return { k: 'cerrado', t: '✓ Cerrado' };
  if (ac && ac.fechaLimite && new Date(ac.fechaLimite + 'T23:59:59') < new Date()) return { k: 'vencido', t: 'Vencido' };
  if (ac && ac.responsable) return { k: 'en_proceso', t: 'En atención' };
  return { k: 'abierto', t: 'Abierto' };
}

// Responsable y fecha: crea (o cambia) la acción correctiva del hallazgo.
function asignar(id, origen) {
  const ac = getAcciones().find(a => a.hallazgoId === id) || {};
  const hoy = new Date().toISOString().slice(0, 10);
  skfSheet('¿Quién lo corrige y para cuándo?', `
    <label class="pw-sub" for="asResp" style="margin-top:4px">Responsable</label>
    <input class="pw-inp" id="asResp" value="${esc(ac.responsable || '')}" placeholder="Nombre de quien lo corrige" autocomplete="name">
    <label class="pw-sub" for="asCorreo">Correo <span style="font-weight:400">(opcional: le llega el aviso)</span></label>
    <input class="pw-inp" id="asCorreo" type="email" value="${esc(ac.correo || '')}" inputmode="email">
    <label class="pw-sub" for="asFecha">Corregir antes del</label>
    <input class="pw-inp" id="asFecha" type="date" min="${hoy}" value="${esc(ac.fechaLimite || '')}">
    <p class="pw-err" id="asErr" hidden></p>
    <button type="button" class="pw-sig pw-fin" id="asOk" style="margin-top:14px">Guardar</button>`, origen);
  document.getElementById('asOk').onclick = () => {
    const responsable = document.getElementById('asResp').value.trim();
    if (!responsable) { const e = document.getElementById('asErr'); e.textContent = 'Escribe quién lo corrige.'; e.hidden = false; return; }
    const acciones = getAcciones();
    let a = acciones.find(x => x.hallazgoId === id);
    if (!a) { a = { id: skfUUID(), hallazgoId: id, estado: 'pendiente', creadoEn: new Date().toISOString() }; acciones.push(a); }
    a.responsable = responsable; a.correo = document.getElementById('asCorreo').value.trim() || null;
    a.fechaLimite = document.getElementById('asFecha').value || null;
    setAcciones(acciones); skfSyncOrQueue('accionCorrectiva', a);
    const list = getHallazgos(), h = list.find(x => x.id === id);
    if (h && (h.estado || 'abierto') === 'abierto') { h.estado = 'en_proceso'; setHallazgos(list); skfSyncOrQueue('hallazgo', h); }
    skfSheetCerrar(); toast('Responsable asignado ✓', 'ok'); render();
  };
}
function reabrir(id) {
  if (!confirm('¿Reabrir este hallazgo? Volverá a contar como abierto.')) return;
  const list = getHallazgos(), h = list.find(x => x.id === id); if (!h) return;
  const acciones = getAcciones(), a = acciones.find(x => x.hallazgoId === id);
  if (a) { a.estado = 'pendiente'; a.cerradoEn = null; setAcciones(acciones); skfSyncOrQueue('accionCorrectiva', a); }
  h.estado = a && a.responsable ? 'en_proceso' : 'abierto'; delete h.cerradoEn; delete h.cerradoPor;
  setHallazgos(list); skfSyncOrQueue('hallazgo', h);
  toast('Hallazgo reabierto', 'ok'); render();
}

// ── Antes y después ───────────────────────────────────────────────────
// «Antes»: la foto del problema (al reportarlo o después). «Después»: la que se toma al
// cerrarlo; se guarda como evidencia de la acción correctiva. Juntas son la prueba,
// ante un inspector, de que el hallazgo se corrigió de verdad.
function fotosHtml(h, ac) {
  const antes = skfFotoSegura(h.foto), despues = skfFotoSegura(ac && ac.evidenciaCierre);
  const abierto = (h.estado||'abierto') !== 'cerrado';
  if (!antes && !despues && !abierto) return '';
  const caja = (url, etq, vacio) => url
    ? `<button type="button" class="hz-foto" onclick="verFoto(this)" data-etq="${etq}"><img src="${url}" alt="Foto de ${etq.toLowerCase()}" loading="lazy"><b>${etq}</b></button>`
    : vacio;
  const portal = (antes || despues) ? `<label class="hz-portal"><input type="checkbox" ${h.fotoOcultaPortal ? '' : 'checked'} onchange="fotoEnPortal('${esc(h.id)}', this)">
      <span>Mostrar estas fotos en el portal del cliente<small>Solo se ven cuando el hallazgo está cerrado. Quítalo si se ve la cara de alguien.</small></span></label>` : '';
  return `<div class="hz-fotos">
    ${caja(antes, 'Antes', abierto
      ? `<label class="hz-foto vacia"><input type="file" accept="image/*" capture="environment" hidden onchange="fotoAntes('${esc(h.id)}', this)">📷<b>Agregar foto del problema</b></label>`
      : `<div class="hz-foto vacia"><b>Sin foto de antes</b></div>`)}
    ${caja(despues, 'Después', `<div class="hz-foto vacia"><b>${abierto ? 'Se toma al cerrar' : 'Cerrado sin foto'}</b></div>`)}
  </div>${portal}`;
}
async function fotoEnPortal(id, chk) {
  chk.disabled = true;
  try {
    await skfFetch('/api/hallazgos/' + encodeURIComponent(id) + '/foto-portal', { method: 'POST', body: JSON.stringify({ oculta: !chk.checked }) });
    const list = getHallazgos(), h = list.find(x => x.id === id);
    if (h) { h.fotoOcultaPortal = !chk.checked; setHallazgos(list); }
    toast(chk.checked ? 'Las fotos se verán en el portal' : 'Fotos ocultas en el portal', 'ok');
  } catch (e) {
    chk.checked = !chk.checked;
    toast(navigator.onLine ? (e.message || 'No se pudo cambiar') : 'Necesitas conexión para cambiarlo', 'er');
  }
  chk.disabled = false;
}
function verFoto(btn) {
  const img = btn.querySelector('img');
  skfSheet(btn.dataset.etq, `<img src="${img.src}" alt="${esc(img.alt)}" style="width:100%;border-radius:12px;display:block">`, btn);
}
async function fotoAntes(id, input) {
  const f = input.files && input.files[0]; if (!f) return;
  try {
    const list = getHallazgos(), h = list.find(x => x.id === id); if (!h) return;
    h.foto = await skfComprimirFoto(f);
    setHallazgos(list); skfSyncOrQueue('hallazgo', h);
    toast('Foto del problema guardada ✓', 'ok'); render();
  } catch (e) { toast('No se pudo usar esa foto', 'er'); }
}

let _cierre = null;   // { id, foto }
function abrirCierre(id, origen) {
  const h = getHallazgos().find(x => x.id === id); if (!h) return;
  _cierre = { id, foto: null };
  const antes = skfFotoSegura(h.foto);
  skfSheet('Cerrar hallazgo', `
    <p class="cz-nota">${esc(h.descripcion || h.campoEtiqueta || h.plantillaNombre || 'Hallazgo')}</p>
    <div class="cz-fotos">
      ${antes ? `<div class="hz-foto"><img src="${antes}" alt="Foto de antes"><b>Antes</b></div>` : `<div class="hz-foto vacia"><b>Sin foto de antes</b></div>`}
      <div class="hz-foto vacia" id="czDespues"><b>Después</b></div>
    </div>
    <label class="cz-tomar"><input type="file" accept="image/*" capture="environment" hidden onchange="fotoDespues(this)">📷 <span id="czTxt">Tomar foto de cómo quedó</span></label>
    <p class="cz-nota" style="margin-top:10px">La foto de después, junto a la de antes, es tu prueba ante un inspector de que se corrigió.</p>
    <div class="cz-acc">
      <button type="button" class="cz-ok" id="czOk" onclick="confirmarCierre(true)" disabled>✓ Cerrar con la foto</button>
      <button type="button" class="cz-sin" onclick="confirmarCierre(false)">Cerrar sin foto</button>
    </div>`, origen, () => { _cierre = null; render(); });
}
async function fotoDespues(input) {
  const f = input.files && input.files[0]; if (!f || !_cierre) return;
  try {
    _cierre.foto = await skfComprimirFoto(f);
    const box = document.getElementById('czDespues');
    box.className = 'hz-foto'; box.innerHTML = `<img src="${_cierre.foto}" alt="Foto de después"><b>Después</b>`;
    document.getElementById('czTxt').textContent = 'Cambiar foto';
    document.getElementById('czOk').disabled = false;
  } catch (e) { toast('No se pudo usar esa foto', 'er'); }
}
async function confirmarCierre(conFoto) {
  if (!_cierre) return;
  const { id, foto } = _cierre;
  const ahora = new Date().toISOString();
  const acciones = getAcciones();
  let ac = acciones.find(a => a.hallazgoId === id);
  if (!ac) {   // cerrar sin acción asignada: se registra una ya completada, para que la evidencia tenga dónde vivir
    let yo = null; try { yo = await skfYo(); } catch (e) {}
    ac = { id: skfUUID(), hallazgoId: id, responsable: (yo && (yo.nombre || yo.email)) || 'Sin asignar', correo: null,
           fechaLimite: null, creadoEn: ahora };
    acciones.push(ac);
  }
  ac.estado = 'completada'; ac.cerradoEn = ahora;
  if (conFoto && foto) ac.evidenciaCierre = foto;
  setAcciones(acciones); skfSyncOrQueue('accionCorrectiva', ac);
  const list = getHallazgos(), h = list.find(x => x.id === id);
  if (h) { h.estado = 'cerrado'; setHallazgos(list); skfSyncOrQueue('hallazgo', h); }
  _cierre = null;
  skfSheetCerrar();
  toast(conFoto && foto ? 'Hallazgo cerrado con evidencia ✓' : 'Hallazgo cerrado ✓', 'ok');
}

let _tt;
function toast(msg,type='ok') {
  document.querySelectorAll('.toast').forEach(e=>e.remove());
  clearTimeout(_tt);
  const d=document.createElement('div');
  d.className=`toast ${type}`;
  d.innerHTML=`<span>${type==='ok'?'✓':'✕'}</span> ${msg}`;
  document.body.appendChild(d);
  _tt=setTimeout(()=>d.remove(),3200);
}

async function init() {
  await syncFromCloud();
  renderFilters();
  render();
}
init();

// Llega un hallazgo crítico por Realtime mientras esta página está
// abierta (ver skfSubscribeCriticalAlerts en skf-api.js) —
// refresca la lista sin que el usuario tenga que recargar.
window.addEventListener('skf:hallazgo-critico', async () => {
  await syncFromCloud();
  render();
});
</script>
</body>
