<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Iniciar sesión — SEKaform</title>
  <link rel="stylesheet" href="styles.css">
  <meta http-equiv="refresh" content="0; url=/login">
  <style>
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;
         min-height:100vh;padding:20px;text-align:center;}
    .logo{font-size:2rem;font-weight:900;letter-spacing:-1px;margin-bottom:6px;}
    .logo span{color:var(--pri);}
    .sub{color:var(--mut);font-size:.9rem;}
    a{color:var(--pri);}
  </style>
</head>
<body>
  <!--
    Esta pantalla ya no vive aquí.

    Cuando la aplicación hablaba con Supabase directamente, el inicio de sesión
    y el restablecimiento de contraseña se resolvían en esta página con
    JavaScript. Con el backend propio los formularios los sirve Flask:

      /login            entrar
      /registro         alta
      /recuperar        pedir el enlace de restablecimiento
      /restablecer/<t>  poner la contraseña nueva

    Está mejor ahí: la contraseña no pasa por un archivo estático cacheado, el
    límite de intentos se aplica del lado del servidor y el token de
    restablecimiento se valida contra la base, no contra el fragmento de la URL.

    El archivo se conserva —en vez de borrarlo— porque el service worker lo
    tiene cacheado en los navegadores que ya instalaron la PWA, y porque puede
    haber enlaces y marcadores viejos apuntando aquí. Redirige y ya.
  -->
  <div class="logo">SEK<span>aform</span></div>
  <p class="sub">Llevándote a la pantalla de acceso… <a href="/login">Entrar</a></p>
  <script>location.replace('/login');</script>
</body>
</html>
