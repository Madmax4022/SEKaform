name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar pruebas de analyzeText
        run: node tests/analyzeText.test.cjs

      - name: Ejecutar pruebas de field-types.js
        run: node tests/fieldTypes.test.cjs

      - name: Ejecutar pruebas del código de plantilla
        run: node tests/codigoPlantilla.test.cjs
