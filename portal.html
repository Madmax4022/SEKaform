<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="icons/icon-192.png">
  <title>Portal de cumplimiento — SEKaform</title>
  <link rel="stylesheet" href="styles.css">
  <script src="form-library.js"></script>
  <style>
    body { padding: 0 !important; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 22px 16px 40px; }
    .cab { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
    .av { width: 54px; height: 54px; border-radius: 16px; flex: 0 0 54px; display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 1.4rem; color: #fff; background: linear-gradient(145deg, #3b82f6, #1d4ed8); }
    .org { font-size: 1.35rem; font-weight: 900; letter-spacing: -.3px; line-height: 1.2; }
    .sub { color: var(--mut); font-size: .84rem; margin-top: 2px; line-height: 1.4; }
    .norma { color: var(--mut); font-size: .8rem; margin: 10px 0 16px; line-height: 1.45; }
    .kpis { display: grid; grid-template-columns: 112px 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    .kpi { background: var(--card); border: 1px solid var(--bor); border-radius: 18px; padding: 12px 14px; }
    .kpi b { display: block; font-size: 1.7rem; font-weight: 900; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
    .kpi span { color: var(--mut); font-size: .76rem; font-weight: 700; line-height: 1.3; display: block; }
    .kpi.anillo { grid-row: span 2; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px; }
    .kpi.anillo svg { width: 88px; height: 88px; }
    .an-n { font-size: 1.6rem; font-weight: 900; fill: var(--txt); }
    .an-de { font-size: .6rem; font-weight: 700; fill: var(--mut); }
    .kpi.alto b { color: var(--ok); } .kpi.medio b { color: var(--warn); } .kpi.bajo b, .kpi.mal b { color: var(--err-txt); }
    h2 { font-size: 1.05rem; font-weight: 800; margin: 24px 2px 10px; }
    .pr { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--bor); }
    .pr:last-child { border-bottom: none; }
    .caja { background: var(--card); border: 1px solid var(--bor); border-radius: 18px; overflow: hidden; }
    .pr .n { color: var(--mut); font-weight: 800; font-variant-numeric: tabular-nums; }
    .pr .t { font-weight: 700; font-size: .92rem; }
    .est { font-size: .72rem; font-weight: 800; border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
    .est.ok { background: var(--ok-dim); color: var(--ok); }
    .est.warn { background: rgba(245,158,11,.16); color: var(--warn); }
    .est.pend { background: var(--bor); color: var(--txt); }
    .hz { padding: 12px 14px; border-bottom: 1px solid var(--bor); }
    .hz:last-child { border-bottom: none; }
    .hz-t { font-weight: 700; font-size: .92rem; line-height: 1.35; }
    .hz-d { color: var(--mut); font-size: .78rem; margin-top: 4px; line-height: 1.4; }
    .sev { font-size: .68rem; font-weight: 800; border-radius: 999px; padding: 2px 8px; margin-right: 6px; }
    .sev.critico { background: rgba(248,113,113,.16); color: #fca5a5; } .sev.mayor { background: rgba(245,158,11,.16); color: var(--warn); }
    .sev.menor { background: var(--bor); color: var(--txt); } .sev.cerrado { background: var(--ok-dim); color: var(--ok); }
    .ins { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--bor); }
    .ins:last-child { border-bottom: none; }
    .pct { font-weight: 900; font-variant-numeric: tabular-nums; font-size: .95rem; }
    .pct.alto { color: var(--ok); } .pct.medio { color: var(--warn); } .pct.bajo { color: var(--err-txt); }
    .vacio { padding: 14px; color: var(--mut); font-size: .88rem; }
    .acc { display: flex; gap: 8px; margin-top: 22px; }
    .acc button { flex: 1; min-height: 48px; border-radius: 14px; font: inherit; font-weight: 800; cursor: pointer; border: 1px solid var(--bor); background: var(--card); color: var(--txt); }
    .pie { text-align: center; color: var(--mut); font-size: .76rem; margin-top: 26px; line-height: 1.5; }
    .pie a { color: var(--pri-txt); }
    .error { text-align: center; padding: 60px 18px; }
    .error h1 { font-size: 1.3rem; margin: 10px 0 6px; }
    .error p { color: var(--mut); line-height: 1.5; }
    @media (max-width: 420px) { .kpis { grid-template-columns: 1fr 1fr; } .kpi.anillo { grid-row: auto; grid-column: 1 / -1; flex-direction: row; gap: 12px; } }
    @media print {
      :root { --bg: #fff; --card: #fff; --txt: #0f172a; --mut: #475569; --bor: #cbd5e1; --ok: #047857; --warn: #b45309; --err-txt: #b91c1c; --pri-txt: #1d4ed8; }
      body { background: #fff !important; color: #0f172a; }
      .acc { display: none; }
      .caja, .kpi { break-inside: avoid; }
    }
  </style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"><p class="vacio">Cargando el estado de cumplimiento…</p></main>

<script>
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const PAIS_COD = { colombia:'co', co:'co', 'panamá':'pa', panama:'pa', pa:'pa', 'costa rica':'cr', cr:'cr', 'el salvador':'sv', sv:'sv' };
const fecha = f => f ? new Date(f).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const NIVEL = { alto: 'Cumplimiento alto', medio: 'Cumplimiento medio', bajo: 'Cumplimiento bajo' };
const ST = { ok: 'Al día', warn: 'Atrasado', pend: 'Sin evidencia' };
const token = new URLSearchParams(location.search).get('t') || '';

function anillo(n) {
  const c = n === 9 ? 'var(--ok)' : n >= 5 ? 'var(--pri-txt)' : 'var(--warn)';
  return `<svg viewBox="0 0 88 88" role="img" aria-label="${n} de 9 principios con evidencia al día">
    <circle cx="44" cy="44" r="36" fill="none" stroke="var(--bor)" stroke-width="9"/>
    ${n ? `<circle cx="44" cy="44" r="36" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(226.2 * n / 9).toFixed(1)} 226.2" transform="rotate(-90 44 44)"/>` : ''}
    <text x="44" y="48" text-anchor="middle" class="an-n">${n}</text><text x="44" y="62" text-anchor="middle" class="an-de">de 9</text></svg>`;
}

function pintar(d) {
  const pc = PAIS_COD[String(d.org.pais || '').trim().toLowerCase()] || 'co';
  const L = (typeof SST_LOCAL !== 'undefined' && (SST_LOCAL[pc] || SST_LOCAL.co)) || {};
  const ev = skfEvidenciaPrincipios(d.evidencia, pc);
  const est = SST_PRINCIPIOS.map(p => ({ p, st: skfEstadoPrincipio(ev[p.id]) }));
  const nOk = est.filter(x => x.st === 'ok').length;
  const abiertos = d.hallazgos.filter(h => h.estado !== 'cerrado');
  const criticos = abiertos.filter(h => h.severidad === 'critico').length;
  const nivel = d.puntajePromedio == null ? '' : d.puntajePromedio >= 90 ? 'alto' : d.puntajePromedio >= 70 ? 'medio' : 'bajo';
  document.title = d.org.nombre + ' — Portal de cumplimiento';
  const hzFila = h => `<div class="hz"><div class="hz-t"><span class="sev ${h.estado === 'cerrado' ? 'cerrado' : esc(h.severidad)}">${h.estado === 'cerrado' ? 'Cerrado' : esc(h.severidad || 'menor')}</span>${esc(h.descripcion)}</div>
    <div class="hz-d">${[h.formulario, h.lugar, 'Detectado el ' + fecha(h.creado_en),
      h.estado === 'cerrado' ? 'cerrado el ' + fecha(h.cerrado_en) : (h.fecha_limite ? 'corregir antes del ' + fecha(h.fecha_limite) : 'sin fecha de corrección')]
      .filter(Boolean).map(esc).join(' · ')}</div></div>`;
  document.getElementById('app').innerHTML = `
    <div class="cab"><div class="av" aria-hidden="true">${esc((d.org.nombre || '?').trim()[0].toUpperCase())}</div>
      <div><div class="org">${esc(d.org.nombre)}</div><div class="sub">Seguridad y salud en el trabajo · al ${fecha(new Date())}, ${new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })}</div></div></div>
    <p class="norma">${L.pais ? 'Según ' + esc(L.pais) + (L.norma ? ' · ' + esc(L.norma) : '') + '. ' : ''}Estos datos se actualizan solos con cada inspección registrada.</p>
    <div class="kpis">
      <div class="kpi anillo">${anillo(nOk)}<span>principios con evidencia al día</span></div>
      <div class="kpi ${nivel}"><b>${d.puntajePromedio == null ? '—' : d.puntajePromedio + ' %'}</b><span>${d.puntajePromedio == null ? 'puntaje de inspecciones' : NIVEL[nivel] + ' (últimas inspecciones)'}</span></div>
      <div class="kpi"><b>${d.envios30d}</b><span>registros en los últimos 30 días</span></div>
      <div class="kpi ${abiertos.length ? 'mal' : 'alto'}"><b>${abiertos.length}</b><span>hallazgos abiertos${criticos ? ' · ' + criticos + ' crítico' + (criticos !== 1 ? 's' : '') : ''}</span></div>
      <div class="kpi"><b>${d.hallazgos.length - abiertos.length}</b><span>hallazgos cerrados en 90 días</span></div>
    </div>
    <h2>Los 9 principios de SST</h2>
    <div class="caja">${est.map(x => `<div class="pr"><span class="n">${x.p.num}</span><span class="t">${esc(x.p.nombre)}</span><span class="est ${x.st}">${ST[x.st]}</span></div>`).join('')}</div>
    <h2>Hallazgos</h2>
    <div class="caja">${d.hallazgos.length ? d.hallazgos.map(hzFila).join('') : '<p class="vacio">Sin hallazgos abiertos ni cerrados recientemente.</p>'}</div>
    <h2>Últimas inspecciones</h2>
    <div class="caja">${d.inspecciones.length ? d.inspecciones.slice(0, 15).map(i => `<div class="ins"><div><div class="hz-t">${esc(i.formulario)}</div>
      <div class="hz-d">${[fecha(i.fecha), i.lugar].filter(Boolean).map(esc).join(' · ')}</div></div>
      ${i.pct == null ? '' : `<span class="pct ${i.nivel}">${i.pct} %</span>`}</div>`).join('') : '<p class="vacio">Aún no hay inspecciones registradas.</p>'}</div>
    <div class="acc"><button type="button" onclick="cargar()">↻ Actualizar</button><button type="button" onclick="print()">⬇ Descargar PDF</button></div>
    <p class="pie">Portal de solo lectura. No muestra respuestas detalladas, firmas ni fotos.<br>Hecho con <a href="https://sekaform.kanansentinel.com" rel="noopener">SEKaform · Kanan Sentinel</a></p>`;
}

async function cargar() {
  const app = document.getElementById('app');
  try {
    const r = await fetch('/api/publico/portal/' + encodeURIComponent(token), { credentials: 'omit', cache: 'no-store' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Este portal no está disponible.');
    pintar(d);
  } catch (e) {
    app.innerHTML = `<div class="error"><div style="font-size:2.4rem">🔒</div><h1>Portal no disponible</h1><p>${esc(navigator.onLine ? e.message : 'Sin conexión. Vuelve a intentarlo cuando tengas señal.')}</p></div>`;
  }
}
cargar();
</script>
</body>
</html>
